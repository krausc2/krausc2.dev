name: Webserver Deployment

on:
  push:
    tags:
      - "v*" # Trigger action on any tag beginning with "v"

jobs:
  deploy:
    runs-on: self-hosted
    environment:
      name: production
      url: https://krausc2.dev/

    steps:
      - name: Fetch & Deploy
        run: |
          cd /Users/krausc2/Development/krausc2.dev

          # 1. Clean previous build changes and fetch tags
          git reset --hard
          git fetch --all --tags

          # 2. Checkout the version tag that triggered this workflow
          git checkout ${{ github.ref_name }}

          # 3. Inject tag version into package.json (stripping leading 'v')
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json

          # 4. Rebuild and restart Docker containers
          docker compose down
          docker compose up -d --build
